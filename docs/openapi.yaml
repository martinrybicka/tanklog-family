components:
  schemas:
    Access:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        vehicle_id:
          type: string
          format: uuid
          readOnly: true
        user_id:
          type: string
          format: uuid
          readOnly: true
        username:
          type: string
          readOnly: true
        display_name:
          type: string
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
        role:
          allOf:
          - $ref: '#/components/schemas/VehicleAccessRoleEnum'
          readOnly: true
        granted_by_id:
          type: string
          format: uuid
          readOnly: true
        version:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - display_name
      - granted_by_id
      - id
      - is_active
      - role
      - updated_at
      - user_id
      - username
      - vehicle_id
      - version
    AccessInput:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        role:
          $ref: '#/components/schemas/VehicleAccessRoleEnum'
      required:
      - role
      - user_id
    AdminCreate:
      type: object
      properties:
        current_password:
          type: string
          writeOnly: true
          maxLength: 256
        username:
          type: string
          pattern: ^[a-zA-Z0-9_.@+-]+$
          maxLength: 150
        display_name:
          type: string
          default: ''
          maxLength: 150
        email:
          oneOf:
          - type: string
            format: email
            default: ''
            maxLength: 254
          - type: string
            maxLength: 0
        system_role:
          allOf:
          - $ref: '#/components/schemas/SystemRoleEnum'
          default: USER
      required:
      - current_password
      - username
    Audit:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        occurred_at:
          type: string
          format: date-time
          readOnly: true
        actor_name:
          type: string
        action:
          type: string
          maxLength: 60
        entity_type:
          type: string
          maxLength: 40
        entity_id:
          type: string
          format: uuid
          nullable: true
        vehicle_id:
          type: string
          format: uuid
          nullable: true
        request_id:
          type: string
          maxLength: 36
        changes: {}
      required:
      - action
      - id
      - occurred_at
    AvailableVehicleOutput:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        status:
          type: string
      required:
      - id
      - name
      - status
    BlankEnum:
      enum:
      - ''
    ChartsOutput:
      type: object
      properties:
        purchases:
          type: array
          items:
            $ref: '#/components/schemas/PurchasePointOutput'
        consumption:
          type: array
          items:
            $ref: '#/components/schemas/IntervalOutput'
      required:
      - consumption
      - purchases
    ComparisonOutput:
      type: object
      properties:
        standard:
          type: string
        difference_l_100km:
          type: string
        difference_percent:
          type: string
        methodology:
          type: string
        source:
          type: string
        source_note:
          type: string
      required:
      - difference_l_100km
      - difference_percent
      - methodology
      - source
      - source_note
      - standard
    ConfirmInput:
      type: object
      properties:
        confirmed:
          type: boolean
        confirmed_warning_codes:
          type: array
          items:
            type: string
            maxLength: 50
          maxItems: 30
      required:
      - confirmed
    ConsumptionModeEnum:
      enum:
      - UNSUPPORTED_UNIT
      - SINGLE_TANK
      - UNSUPPORTED_MULTI_TANK
      type: string
      description: |-
