      parameters:
      - in: query
        name: date_from
        schema:
          type: string
          format: date
      - in: query
        name: date_to
        schema:
          type: string
          format: date
      - in: query
        name: fuel_type
        schema:
          enum:
          - PETROL
          - DIESEL
          - LPG
          - ETHANOL
          - OTHER_LIQUID
          type: string
          minLength: 1
        description: |-
          * `PETROL` - Benzín
          * `DIESEL` - Nafta
          * `LPG` - LPG
          * `ETHANOL` - Ethanol
          * `OTHER_LIQUID` - Jiné kapalné palivo
      - in: query
        name: ordering
        schema:
          enum:
          - date
          - -date
          - total_amount
          - -total_amount
          - liters
          - -liters
          - odometer_km
          - -odometer_km
          type: string
          minLength: 1
        description: |-
          * `date` - date
          * `-date` - -date
          * `total_amount` - total_amount
          * `-total_amount` - -total_amount
          * `liters` - liters
          * `-liters` - -liters
          * `odometer_km` - odometer_km
          * `-odometer_km` - -odometer_km
      - in: query
        name: page
        schema:
          type: integer
          minimum: 1
      - in: query
        name: page_size
        schema:
          type: integer
          maximum: 100
          minimum: 1
      - in: query
        name: search
        schema:
          type: string
          maxLength: 200
      - in: query
        name: station_code
        schema:
          enum:
          - ORLEN
          - SHELL
          - MOL
          - OMV
          - EUROOIL
          - TANK_ONO
          - OTHER
          - ''
          type: string
        description: |-
          * `ORLEN` - ORLEN
          * `SHELL` - Shell
          * `MOL` - MOL
          * `OMV` - OMV
          * `EUROOIL` - EuroOil
          * `TANK_ONO` - Tank ONO
          * `OTHER` - Ostatní
      - in: query
