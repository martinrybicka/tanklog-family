name: tanklog-dev

services:
  backend:
    build:
      target: development
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DJANGO_DEBUG: "true"
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: .
      dockerfile: infra/frontend.Dockerfile
      target: development
    environment:
      HMR_CLIENT_PORT: "8080"
    volumes:
      - ./frontend:/app
      - frontend_modules:/app/node_modules
    networks: [application]

  web:
    image: nginx:1.30.2-alpine@sha256:5f979dcfed4ce6461873f087e8c980d6e29b084b9e8776d9704a7e989b5f4898
    # Vývoj používá hotový nginx bez produkčního frontendového buildu.
    build: !reset null
    ports:
      - 127.0.0.1:8080:8080
    volumes:
      - ./infra/nginx/development.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/nginx/common-http.conf:/etc/nginx/conf.d/00-common.conf:ro
      - ./infra/nginx/proxy-api.conf:/etc/nginx/tanklog/proxy-api.conf:ro
      - ./infra/nginx/security-headers.conf:/etc/nginx/tanklog/security-headers.conf:ro
    depends_on:
      frontend:
        condition: service_started

volumes:
  frontend_modules:
