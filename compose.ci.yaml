# Pouze izolované syntetické testy. Spouští infra/ci/containers.py s vlastním -p a env-file.
name: tanklog-ci
services:
  backend:
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DJANGO_DEBUG: "false"
      TANKLOG_E2E: "1"
    volumes:
      - ./backend/tests:/app/tests:ro
  web:
    ports:
      - 127.0.0.1:18080:8080
    environment:
      NPM_TRUSTED_CIDR: 127.0.0.1/32
