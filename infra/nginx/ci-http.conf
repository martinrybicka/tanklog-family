# Výhradně izolovaný Compose CI na loopbacku: testy sdílejí jednu IP a rychle střídají účty.
# Produkční image nadále kopíruje common-http.conf s původními limity.
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
limit_req_zone $binary_remote_addr zone=tanklog_login:10m rate=10000r/m;
limit_req_zone $binary_remote_addr zone=tanklog_upload:10m rate=10000r/m;
server_tokens off;
log_format tanklog '$request_id $request_method $uri $status $request_time';
