# Soukromé účtenky mají samostatný omezený upload; ostatní API zůstává na 1 MiB.
location ~ ^/api/v1/(refuelings/[0-9a-f-]+/receipt|family/receipts)/$ {
    client_max_body_size 12m;
    limit_req zone=tanklog_upload burst=10 nodelay;
    limit_req_status 429;
    error_page 413 = @upload_too_large;
    error_page 502 503 504 = @api_unavailable;
    error_page 429 = @upload_limited;
    proxy_pass http://backend:8000;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $tanklog_proto;
    proxy_connect_timeout 5s;
    proxy_read_timeout 35s;
}
location @upload_too_large {
    include /etc/nginx/tanklog/security-headers.conf;
    default_type application/json;
    add_header Cache-Control "private, no-store" always;
    return 413 '{"error":{"code":"file_too_large","message":"Požadavek přesahuje 12 MiB.","fields":{},"request_id":"$request_id"}}';
}
location @upload_limited {
    include /etc/nginx/tanklog/security-headers.conf;
    default_type application/json;
    add_header Retry-After 60 always;
    add_header Cache-Control "private, no-store" always;
    return 429 '{"error":{"code":"upload_limited","message":"Příliš mnoho požadavků na účtenky. Zkuste to za minutu.","fields":{},"request_id":"$request_id"}}';
}
location = /api/health/ready/ {
    include /etc/nginx/tanklog/security-headers.conf;
    default_type application/json;
    add_header Cache-Control "private, no-store" always;
    return 404 '{"error":{"code":"not_found","message":"Adresa není veřejně dostupná.","fields":{},"request_id":"$request_id"}}';
}
location = /api/v1/auth/login/ {
    limit_req zone=tanklog_login burst=10 nodelay;
    limit_req_status 429;
    error_page 429 = @login_limited;
    error_page 413 = @api_too_large;
    error_page 502 503 504 = @api_unavailable;
    proxy_pass http://backend:8000;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $tanklog_proto;
}
location @login_limited {
    include /etc/nginx/tanklog/security-headers.conf;
    default_type application/json;
    add_header Retry-After 900 always;
    add_header Cache-Control "private, no-store" always;
    return 429 '{"error":{"code":"login_locked","message":"Příliš mnoho pokusů. Zkuste to později.","fields":{},"request_id":"$request_id"}}';
}
location /api/ {
    error_page 413 = @api_too_large;
    error_page 502 503 504 = @api_unavailable;
    proxy_pass http://backend:8000;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $tanklog_proto;
    proxy_connect_timeout 5s;
    proxy_read_timeout 35s;
}
# Soukromé soubory nikdy nepodáváme přes veřejný alias.
location /media/ { return 404; }
location /private_media/ { return 404; }

location @api_too_large {
    include /etc/nginx/tanklog/security-headers.conf;
    default_type application/json;
    add_header Cache-Control "private, no-store" always;
    return 413 '{"error":{"code":"request_too_large","message":"Požadavek přesahuje 1 MiB.","fields":{},"request_id":"$request_id"}}';
}
location @api_unavailable {
    include /etc/nginx/tanklog/security-headers.conf;
    default_type application/json;
    add_header Cache-Control "private, no-store" always;
    return 503 '{"error":{"code":"service_unavailable","message":"Server je dočasně nedostupný. Zkuste to znovu.","fields":{},"request_id":"$request_id"}}';
}

location = /api {
    include /etc/nginx/tanklog/security-headers.conf;
    default_type application/json;
    add_header Cache-Control "private, no-store" always;
    return 404 '{"error":{"code":"not_found","message":"Požadovaná adresa neexistuje.","fields":{},"request_id":"$request_id"}}';
}
