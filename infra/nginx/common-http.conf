map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
limit_req_zone $binary_remote_addr zone=tanklog_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=tanklog_upload:10m rate=30r/m;
server_tokens off;

# Bez query stringu, cookies, IP a payloadu; pouze bezpečné provozní údaje.
log_format tanklog '$request_id $request_method $uri $status $request_time';
