name: tanklog

services:
  db:
    image: postgres:18.6-bookworm@sha256:5c4783a8cc3f0074912164f94dfa1be4e043438f0f707cf968d7af9a0d31a2c8
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tanklog}
      POSTGRES_USER: ${POSTGRES_USER:-tanklog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Vygenerujte .env pomoci python3 infra/setup_env.py}
    volumes:
      # PostgreSQL 18 ukládá cluster do verzovaného podadresáře tohoto mountu.
      - postgres_data:/var/lib/postgresql
    networks: [database]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: infra/backend.Dockerfile
      target: production
    environment:
      RSV_API_KEY: ${RSV_API_KEY:-}
      COMMONS_USER_AGENT: ${COMMONS_USER_AGENT:-}
      DJANGO_SETTINGS_MODULE: config.settings.production
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Vygenerujte .env pomoci python3 infra/setup_env.py}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost:8080}
      POSTGRES_DB: ${POSTGRES_DB:-tanklog}
      POSTGRES_USER: ${POSTGRES_USER:-tanklog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Vyplnte POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    tmpfs:
      - /tmp:rw,noexec,nosuid,mode=1777,size=${BACKEND_TMPFS_SIZE:-268435456}
    networks: [application, database]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import os, urllib.request; request = urllib.request.Request('http://127.0.0.1:8000/api/health/ready/', headers={'Host': os.environ['DJANGO_ALLOWED_HOSTS'].split(',')[0].strip()}); urllib.request.urlopen(request, timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: infra/frontend.Dockerfile
      target: production
    networks: [application]
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  application:
  database:
    internal: true
